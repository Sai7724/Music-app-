name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'packages/mobile/**'
      - 'packages/ui/**'
      - 'packages/i18n/**'
      - 'packages/model/**'
      - 'packages/themes/**'
      - 'packages/tailwind-config/**'
      - '.github/workflows/build-mobile-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js + pnpm ─────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 4. Build web app ───────────────────────────────────────────────────
      - name: Build mobile web app
        working-directory: packages/mobile
        env:
          VITE_STREAM_SERVER_URL: ${{ secrets.VITE_STREAM_SERVER_URL || '' }}
        run: pnpm build

      # ── 5. Capacitor Android ───────────────────────────────────────────────
      - name: Add Android platform (if not present)
        working-directory: packages/mobile
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists, skipping add"
          fi

      - name: Sync Capacitor Android
        working-directory: packages/mobile
        run: npx cap sync android

      # ── 6. Cache Gradle ────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/mobile/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 7. Build APK ───────────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      # ── 8. Upload APK artifact ─────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuclear-Android-${{ github.sha }}
          path: packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build summary
        run: |
          echo "## Android Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**APK artifact:** Nuclear-Android-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to install" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the APK from the Artifacts section above" >> $GITHUB_STEP_SUMMARY
          echo "2. Transfer to your Android device" >> $GITHUB_STEP_SUMMARY
          echo "3. Enable 'Install from unknown sources' in Settings → Security" >> $GITHUB_STEP_SUMMARY
          echo "4. Tap the APK to install" >> $GITHUB_STEP_SUMMARY
