# Render deployment configuration
# Commit this file to your repo, then create a new Web Service on render.com
# and point it at this render.yaml (Blueprint).

services:
  - type: web
    name: nuclear-stream-server
    runtime: node
    region: oregon
    plan: free          # upgrade to starter for always-on
    buildCommand: "npm install && npm run build"
    startCommand: "node dist/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4200
      # Optional: restrict which origins can call this API
      # - key: ALLOWED_ORIGINS
      #   value: capacitor://localhost,https://your-app.example.com
    healthCheckPath: /health
    autoDeploy: true
